<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>🕉 India Temple Pilgrim Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--saffron:#E8610A;--saffron2:#FF8C2A;--saffron3:#c44a00;
--gold:#D4A017;--gold2:#F5CE5A;--gold3:#fff3c4;
--maroon:#5c1010;--maroon2:#3a0808;
--cream:#fdf6ec;--cream2:#fff9f0;
--text:#2a1000;--text2:#5a3010;--text3:#8a6040;
--card:#fffaf4;--border:#e8d5b0;
--shadow:0 4px 24px rgba(100,40,0,0.10);
--r:14px;
}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.hero{
  background:linear-gradient(160deg,var(--maroon2) 0%,var(--maroon) 40%,#7a2010 100%);
  padding:0;position:relative;overflow:hidden;
}
.hero-pattern{
  position:absolute;inset:0;opacity:.07;
  background-image:repeating-linear-gradient(45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%);
  background-size:18px 18px;
}
.hero-inner{padding:28px 20px 22px;position:relative;z-index:1;text-align:center}
.hero-om{font-size:clamp(2.4rem,8vw,4rem);line-height:1;filter:drop-shadow(0 0 20px rgba(212,160,23,.5))}
.hero-title{
  font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(1.3rem,5vw,2.6rem);
  background:linear-gradient(135deg,var(--gold2),#fff,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.15;margin:.4rem 0 .3rem;letter-spacing:.02em;
}
.hero-sub{color:rgba(255,243,196,.75);font-family:'Crimson Pro',serif;font-style:italic;font-size:clamp(.85rem,3vw,1.1rem);margin-bottom:1rem}
.hero-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat-pill{
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,243,196,.25);border-radius:40px;
  padding:5px 14px;font-size:.78rem;color:var(--gold2);font-weight:600;letter-spacing:.04em;
}

/* ── SEARCH BAR ── */
.search-wrap{padding:14px 16px 8px;background:var(--cream);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:white;border:1.5px solid var(--border);border-radius:40px;
  padding:9px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.search-box input{
  flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;
  font-size:.95rem;color:var(--text);background:transparent;
}
.search-box input::placeholder{color:#b09070}
.search-icon{color:var(--saffron);font-size:1.1rem;flex-shrink:0}

/* ── CATEGORY NAV ── */
.cat-nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;padding:7px 16px;border-radius:40px;
  border:1.5px solid var(--border);background:white;
  font-size:.8rem;font-weight:600;color:var(--text2);
  cursor:pointer;transition:.2s;white-space:nowrap;font-family:'DM Sans',sans-serif;
}
.cat-btn.active,.cat-btn:hover{background:var(--saffron);border-color:var(--saffron);color:white}

/* ── CATEGORY CARDS (HOME) ── */
.home-grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.cat-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);
  padding:16px 12px;cursor:pointer;transition:.18s;text-align:center;
  box-shadow:var(--shadow);
}
.cat-card:hover,.cat-card:active{transform:translateY(-2px);box-shadow:0 8px 28px rgba(100,40,0,.14);border-color:var(--saffron)}
.cat-card .icon{font-size:2.2rem;margin-bottom:8px;display:block}
.cat-card .cname{font-family:'Cinzel',serif;font-size:.78rem;font-weight:700;color:var(--maroon);line-height:1.3;margin-bottom:4px}
.cat-card .ccount{
  display:inline-block;background:var(--saffron);color:white;
  border-radius:20px;padding:2px 9px;font-size:.7rem;font-weight:700;
}

/* ── SECTION VIEW ── */
.section-view{display:none}
.section-view.active{display:block}

/* ── BACK HEADER ── */
.back-header{
  background:linear-gradient(135deg,var(--maroon2),var(--maroon));
  padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:99;
}
.back-btn{
  background:rgba(255,255,255,.15);border:none;border-radius:50%;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:white;font-size:1.1rem;cursor:pointer;flex-shrink:0;
}
.back-title{font-family:'Cinzel',serif;color:var(--gold2);font-weight:700;font-size:1rem;line-height:1.2}
.back-sub{color:rgba(255,243,196,.6);font-size:.72rem;margin-top:1px}

/* ── SUB-TABS ── */
.sub-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--cream2);border-bottom:1px solid var(--border);scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{
  flex-shrink:0;padding:6px 14px;border-radius:30px;
  border:1.5px solid var(--border);background:white;
  font-size:.76rem;font-weight:600;color:var(--text2);cursor:pointer;transition:.18s;
}
.sub-tab.active{background:var(--saffron);border-color:var(--saffron);color:white}

/* ── TEMPLE CARDS ── */
.temple-list{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.t-card{
  background:white;border:1.5px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.18s;
}
.t-card:hover{border-color:var(--saffron);box-shadow:0 6px 20px rgba(232,97,10,.15)}
.t-card-header{
  display:flex;align-items:center;gap:10px;padding:12px 14px 10px;
}
.t-num{
  min-width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--saffron),var(--saffron2));
  color:white;font-weight:700;font-size:.75rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Cinzel',serif;
}
.t-main{flex:1;min-width:0}
.t-name{font-family:'Cinzel',serif;font-weight:700;font-size:.88rem;color:var(--maroon);line-height:1.3;word-break:break-word}
.t-deity{color:var(--saffron);font-size:.76rem;font-weight:600;margin-top:2px}
.t-expand{color:var(--text3);font-size:.9rem;transition:.2s;flex-shrink:0}
.t-card.open .t-expand{transform:rotate(180deg)}
.t-details{
  display:none;padding:0 14px 12px;
  border-top:1px dashed var(--border);margin-top:4px;
}
.t-card.open .t-details{display:block}
.t-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:10px}
.t-detail{background:var(--cream);border-radius:10px;padding:8px 11px;border:1px solid rgba(232,160,23,.15)}
.t-detail-label{font-size:.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.t-detail-val{font-size:.8rem;color:var(--text);font-weight:500;line-height:1.4}
.t-detail.full{grid-column:1/-1}
.t-detail.reach{grid-column:1/-1;background:linear-gradient(135deg,#fff8e7,#fff3cd);border:1px solid var(--gold)}
.t-detail.info-box{grid-column:1/-1;background:linear-gradient(135deg,#e8f4fd,#dbeeff);border:1px solid #b3d4f5}
.t-detail.timing-box{background:linear-gradient(135deg,#f0fff0,#e0f7e0);border:1px solid #a8dba8}
.t-tag{
  display:inline-block;background:var(--gold3);color:var(--maroon);
  border-radius:20px;padding:2px 8px;font-size:.68rem;font-weight:700;margin:2px 2px 0 0;border:1px solid var(--gold);
}
.reach-row{display:flex;gap:5px;align-items:flex-start;margin-bottom:5px;font-size:.78rem;line-height:1.4}
.reach-icon{font-size:.85rem;flex-shrink:0;margin-top:1px}
.reach-label{font-weight:700;color:var(--saffron);min-width:55px}
.reach-text{color:var(--text);flex:1}
.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.share-btn{display:flex;align-items:center;gap:5px;background:#25D366;color:white;border:none;border-radius:8px;padding:7px 12px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.maps-btn{display:flex;align-items:center;gap:5px;background:#4285F4;color:white;border:none;border-radius:8px;padding:7px 12px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.edit-btn{
  display:flex;align-items:center;gap:5px;margin-top:10px;
  background:var(--saffron);color:white;border:none;border-radius:8px;
  padding:7px 14px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
}

/* ── EDIT MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:999;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:white;border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;padding:0 0 20px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:4px;margin:12px auto 0}
.modal-title{font-family:'Cinzel',serif;font-weight:700;font-size:1rem;color:var(--maroon);padding:14px 18px 10px;border-bottom:1px solid var(--border)}
.modal-body{padding:14px 18px}
.form-row{margin-bottom:12px}
.form-label{font-size:.75rem;font-weight:700;color:var(--text2);margin-bottom:4px;display:block;letter-spacing:.04em}
.form-input{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--text);
  background:var(--cream);outline:none;
}
.form-input:focus{border-color:var(--saffron);background:white}
textarea.form-input{resize:vertical;min-height:60px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;padding:10px 18px 0}
.btn-save{
  flex:1;background:var(--saffron);color:white;border:none;border-radius:10px;
  padding:11px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.btn-cancel{
  background:var(--cream);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 18px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
}

/* ── PROGRESS BAR (visited) ── */
.progress-wrap{padding:10px 14px 2px;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:6px;background:#f0e0c8;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold));border-radius:3px;transition:.5s}
.progress-label{font-size:.72rem;font-weight:700;color:var(--saffron);white-space:nowrap}
.visited-btn{
  background:none;border:1.5px solid;border-radius:20px;padding:3px 10px;
  font-size:.7rem;font-weight:700;cursor:pointer;margin-left:auto;transition:.18s;
}
.visited-btn.visited{background:var(--gold3);border-color:var(--gold);color:var(--maroon)}
.visited-btn:not(.visited){border-color:var(--border);color:var(--text3)}

/* ── FOOTER / EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:3rem;margin-bottom:8px}
.page-footer{padding:30px 20px;text-align:center;color:var(--text3);font-size:.78rem;border-top:1px solid var(--border);margin-top:20px}
.page-footer strong{color:var(--saffron)}

/* ── HOME VIEW ── */
#homeView{display:block}

/* ── Responsive ── */
@media(min-width:600px){
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
  .modal{border-radius:20px;margin-bottom:20px}
  .modal-overlay{align-items:center}
}
@media(min-width:900px){
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding:20px 24px}
  .temple-list{padding:16px 20px}
  .back-header{padding:16px 24px}
}

/* ── DIVIDER ── */
.region-divider{
  display:flex;align-items:center;gap:10px;padding:16px 14px 6px;
}
.region-divider span{font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;color:var(--saffron);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.region-divider::before,.region-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.t-card{animation:fadeIn .25s ease both}
</style>
</head>
<body>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="hero">
    <div class="hero-pattern"></div>
    <div class="hero-inner">
      <div class="hero-om">🕉</div>
      <div class="hero-title">India Temple<br/>Pilgrim Guide</div>
      <div class="hero-sub">Complete Sacred Temples Database</div>
      <div class="hero-stats">
        <span class="stat-pill">🛕 1200+ Temples</span>
        <span class="stat-pill">📍 28 Categories</span>
        <span class="stat-pill">🌍 India &amp; Overseas</span>
      </div>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="homeSearch" placeholder="Search any temple, deity, city…" oninput="globalSearch(this.value)"/>
    </div>
  </div>
  <div id="searchResults" style="display:none"></div>
  <div id="categoryGrid" class="home-grid"></div>
  <div class="page-footer">
    Made with ❤️ for Pilgrims &nbsp;•&nbsp; <strong>Edit any temple anytime</strong><br/>
    Tap a temple → ✏️ Edit to update details
  </div>
</div>

<!-- SECTION VIEW -->
<div id="sectionView" class="section-view">
  <div class="back-header">
    <button class="back-btn" onclick="goHome()">◀</button>
    <div>
      <div class="back-title" id="sectionTitle"></div>
      <div class="back-sub" id="sectionSub"></div>
    </div>
  </div>
  <div id="subTabsWrap"></div>
  <div class="search-wrap" style="position:relative;top:auto">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="sectionSearch" placeholder="Filter temples…" oninput="filterSection(this.value)"/>
    </div>
  </div>
  <div id="progressWrap" class="progress-wrap" style="display:none">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <div id="templeList" class="temple-list"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Edit Temple Details</div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">🛕 Temple Name</label>
        <input class="form-input" id="e_name" placeholder="Full temple name"/>
      </div>
      <div class="form-row">
        <label class="form-label">🙏 God / Deity</label>
        <input class="form-input" id="e_deity" placeholder="Presiding deity"/>
      </div>
      <div class="form-row">
        <label class="form-label">📍 Full Address (include State &amp; Country)</label>
        <textarea class="form-input" id="e_address" rows="2" placeholder="Village/Town, District, State, Country"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">🗺 How to Reach</label>
        <textarea class="form-input" id="e_reach" rows="3" placeholder="By Road: ...&#10;By Train: ...&#10;By Air: ..."></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">🕐 Temple Timings</label>
        <input class="form-input" id="e_timings" placeholder="e.g. 6:00 AM – 12:00 PM, 4:00 PM – 8:00 PM"/>
      </div>
      <div class="form-row">
        <label class="form-label">📞 Temple Contact</label>
        <input class="form-input" id="e_contact" placeholder="Phone number"/>
      </div>
      <div class="form-row">
        <label class="form-label">📅 Best Visit Months / Festivals</label>
        <input class="form-input" id="e_months" placeholder="e.g. Oct–Feb, Navratri, Shivratri"/>
      </div>
      <div class="form-row">
        <label class="form-label">ℹ️ About Temple</label>
        <textarea class="form-input" id="e_about" rows="3" placeholder="History, significance, special features…"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">👗 Dress Code / Rules</label>
        <input class="form-input" id="e_dresscode" placeholder="e.g. Traditional attire, no leather items"/>
      </div>
      <div class="form-row">
        <label class="form-label">🏨 Accommodation</label>
        <input class="form-input" id="e_stay" placeholder="e.g. Dharamshala, TTD Guest House, nearby hotels"/>
      </div>
      <div class="form-row">
        <label class="form-label">📝 Additional Notes</label>
        <input class="form-input" id="e_notes" placeholder="Any other useful tip for pilgrims"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

<script>

    {sl:5,name:"Kedarnath Temple",deity:"Lord Shiva (Kedarnath)",loc:"Kedarnath, Rudraprayag, Uttarakhand",near:"Gaurikund / Rishikesh",state:"Uttarakhand",country:"India",contact:"01364-263011",months:"May–Jun, Sep–Oct (Open Akshaya Tritiya to Diwali)",address:"Kedarnath, Rudraprayag District, Uttarakhand – 246445, India",timings:"Summer: 4:00 AM – 9:00 PM | Aarti: Dawn & Dusk | Closed: Kartik Purnima (Nov) to Akshaya Tritiya (Apr–May)",about:"One of the 12 Jyotirlingas and part of the Char Dham Yatra. Situated at 3,583 m altitude in the Himalayas near Mandakini River. The temple is believed to be 8th century, built by Adi Shankaracharya. A helicopter service is available from Phata/Sersi to the temple.",reach:"By Road: Drive to Gaurikund (30 km from Sonprayag). Gaurikund to Kedarnath is a 16-18 km trek or pony/doli\nBy Train: Rishikesh (216 km) or Haridwar (247 km) – then road\nBy Air: Jolly Grant Airport, Dehradun (235 km) | Helicopter from Phata/Sersi/Sitapur",dresscode:"Traditional Indian attire. Carry warm clothing (temperature near 0°C at night).",stay:"GMVN Tourist Rest House, private lodges at Kedarnath & Gaurikund",notes:"Trekking required. Closed Nov–Apr."},

      {sl:57,name:"Kallavan Pachai Vannan Temple, Kanchipuram",deity:"Sri Pachai Vannar (Maragatha Vannar – Vishnu in Green) & Mahalakshmi",loc:"Damalwar Street, Melkathirpur, Kanchipuram",near:"Kanchipuram",state:"Tamil Nadu",country:"India",contact:"044-27220003",months:"All year, Vaikunta Ekadasi, Brahmotsavam (Vaikasi)",timings:"6:00 AM – 12:00 PM & 4:00 PM – 8:00 PM",about:"One of the 108 Abhimana Kshetrams. Also called Kallavan temple. Pachai Vannar (emerald green form of Vishnu) gave darshan to sage Marichi here. Located 500m opposite the Divya Desam Pavalavannar temple — both must be visited together. The Lord appears in green colour, a rare form among Vishnu temples. Bhrigu Maharishi and Parvati also worshipped Vishnu here.",reach:"By Road: Buses from Chennai (70 km), Vellore (90 km); temple near Kanchipuram Railway Station\nBy Train: Kanchipuram Railway Station (1 km)\nBy Air: Chennai International Airport (70 km)"},
      {sl:58,name:"Sri Panduranga Rakhumayi Temple, Thennangur",deity:"Sri Panduranga (Krishna) & Rakhumayi Devi",loc:"Thennangur Village, Thiruvannamalai District",near:"Vandavasi",state:"Tamil Nadu",country:"India",contact:"04175-280001",months:"All year, Krishna Jayanthi, Ekadasi",timings:"6:00 AM – 12:00 PM & 4:00 PM – 8:30 PM",about:"One of the 108 Abhimana Kshetrams. A 500-year-old temple founded by Swami Haridhos Giri. The 12-ft Panduranga and 10-ft Rakhumayi idols are made of Salagrama stone, brought from Pandharpur. Unique for following both Vedic (south) and Bhajan (north) traditions. The temple resembles both Pandharpur and Puri Jagannath temples in style. The birthplace of Goddess Meenakshi is said to be nearby.",reach:"By Road: Buses from Vandavasi, Villupuram (70 km), Kanchipuram (80 km), Chennai (110 km) via SH-116\nBy Train: Villupuram Railway Station (70 km)\nBy Air: Chennai International Airport (110 km)"},

      {sl:79,name:"Sree Krishna Swamy Temple, Guruvayur",deity:"Sri Guruvayurappan (Krishna) & Rukmini Thayar",loc:"Guruvayur, Thrissur",near:"Thrissur",state:"Kerala",country:"India",contact:"0487-2556335",months:"All year",timings:"3:00 AM – 1:00 PM & 4:30 PM – 9:15 PM",about:"One of the 108 Abhimana Kshetrams. Known as Bhooloka Dwaraka and Dakshin Dwarka. The 4-armed child Krishna idol (Guruvayurappan) is made of Patala Anjana stone. Adi Shankaracharya composed Krishnashtakam and Narayana Bhattathiri wrote Narayaneeyam here. Over 30,000+ devotees visit daily, making it one of the wealthiest temples in Kerala.",reach:"By Road: Buses from Thrissur (29 km), Palakkad (75 km), Kozhikode (100 km), Kochi (87 km)\nBy Train: Guruvayur Railway Station (2 km) – direct trains from Chennai, Coimbatore, Kozhikode\nBy Air: Cochin International Airport (87 km)",dresscode:"Men wear mundu/dhoti only (no shirt inside); Women in saree or pavadai davani",stay:"Temple Trust Guest Houses, Bhaktinivas, numerous hotels in Guruvayur town"},

      {sl:95,name:"Matru Gaya Teerth – Bindu Sarovar, Siddhpur",deity:"Sri Kapila Mahamuni (Vishnu Avatar) & Gaya Gadhadhara",loc:"Bindu Sarovar Road, Teen Darvaza, Siddhpur, Patan",near:"Patan",state:"Gujarat",country:"India",contact:"02767-222001",months:"All year, Pitru Paksha (Sep–Oct), Chaitra Shraddh (Mar–Apr)",timings:"Sunrise to Sunset | Shraddh rituals by appointment",about:"One of the 108 Abhimana Kshetrams. Known as Matru Gaya — the only place in India where Matru Shradh (shraddh for departed mothers) is performed. Lord Vishnu's tears fell here forming the Bindu Sarovar lake. Kapila Muni (philosophical avatar of Vishnu) was born here and preached Sankhya philosophy to his mother Devahuti. Lord Parashurama performed his mother Renuka's shraddh here. One of the Pancha Sarovars of India.",reach:"By Road: Buses from Patan (22 km), Ahmedabad (120 km)\nBy Train: Siddhpur Railway Station (1 km); Ahmedabad (120 km)\nBy Air: Sardar Vallabhbhai Patel International Airport, Ahmedabad (120 km)",stay:"Guest houses and dharamshalas near Bindu Sarovar; Patan city hotels",notes:"Managed by Gujarat Pavitra Yatradham Vikas Board. Online booking available for shraddh rituals."},
      {sl:96,name:"Vishnu Prayag – Vishnu Narayana Temple, Chamoli",deity:"Sri Vishnu Narayana & Lakshmi (at Panch Prayag Sangam)",loc:"Vishnuprayag, Joshimath, Chamoli",near:"Joshimath",state:"Uttarakhand",country:"India",contact:"-",months:"May–Oct (Badrinath season)",timings:"Dawn to Dusk | Open during pilgrimage season",about:"One of the 108 Abhimana Kshetrams. Vishnuprayag is the first of the Panch Prayag (five sacred confluences) where Alaknanda River meets Dhauliganga River. Situated at 1,372 m in the Chamoli district. Lord Vishnu appeared here to sage Narada during his penance. The Vishnu Narayana temple (built by Maharani Ahilyabai Holkar, 18th century) has octagonal stone architecture. Vishnu Kund nearby is a sacred pool for ritual bathing.",reach:"By Road: Buses from Rishikesh (261 km), Haridwar (287 km) to Joshimath; then 11 km to Vishnuprayag\nBy Train: Rishikesh Railway Station (261 km)\nBy Air: Jolly Grant Airport, Dehradun (287 km)",stay:"Stay in Joshimath (11 km) — hotels, guest houses, GMVN tourist rest house",notes:"Best visited May–June or Sep–Oct. Avoid monsoon (Jul–Aug) due to landslides."},

      {sl:103,name:"Panduranga Vitthal Temple, Pandharpur",deity:"Sri Panduranga Vitthala (Krishna) & Rukmini Rakhumayi",loc:"Pandharpur, Solapur",near:"Solapur",state:"Maharashtra",country:"India",contact:"02186-222221",months:"All year, Ashadhi Ekadashi (Jul), Kartiki Ekadashi (Nov)",timings:"4:30 AM – 11:00 PM | Kakad Aarti: 4:30 AM | Abhishek: 8 AM | Poshakh Darshan: 11 AM | Shej Aarti: 10:30 PM",about:"One of the 108 Abhimana Kshetrams. Known as Bhuvaikuntha (Vaikuntha on earth). Located on the banks of River Bhima (Chandrabhaga). Lord Vitthala (Vishnu/Krishna form) stands on a brick with arms on hips — a unique posture. Sant Dnyaneshwar, Tukaram, Namdev, Eknath, Chokhamela and other great saints were ardent devotees. Adi Shankaracharya composed Pandurangashtakam here. Lakhs of Varkari pilgrims walk barefoot from across Maharashtra and Karnataka.",reach:"By Road: Buses from Pune (209 km), Solapur (77 km), Kolhapur (181 km), Mumbai (365 km)\nBy Train: Pandharpur Railway Station (2 km) — trains from Pune and Miraj\nBy Air: Pune International Airport (209 km)",dresscode:"Traditional attire preferred. Very crowded during Wari festivals — start early.",stay:"Temple dharamshalas, private lodges in Pandharpur town"},

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let currentCat = null;
let currentTabIdx = 0;
let editingKey = null; // "catId-tabIdx-slIdx"
let customData = {}; // override store

function loadCustom(){try{const d=localStorage.getItem('templeEdits');if(d)customData=JSON.parse(d)}catch(e){}}
function saveCustom(){try{localStorage.setItem('templeEdits',JSON.stringify(customData))}catch(e){}}
loadCustom();

function getTemple(catId,tabIdx,slIdx){
  const key=`${catId}-${tabIdx}-${slIdx}`;
  const base={...DB[catId].tabs[tabIdx].temples[slIdx]};
  return customData[key]?{...base,...customData[key]}:base;
}
function setTemple(catId,tabIdx,slIdx,data){
  const key=`${catId}-${tabIdx}-${slIdx}`;
  customData[key]={...customData[key],...data};
  saveCustom();
}

function isVisited(catId,tabIdx,slIdx){
  const k=`visited-${catId}-${tabIdx}-${slIdx}`;
  return localStorage.getItem(k)==='1';
}
function toggleVisit(catId,tabIdx,slIdx,btn){
  const k=`visited-${catId}-${tabIdx}-${slIdx}`;
  const v=localStorage.getItem(k)==='1';
  if(v)localStorage.removeItem(k);else localStorage.setItem(k,'1');
  btn.classList.toggle('visited',!v);
  btn.textContent=v?'☆ Mark Visited':'✅ Visited';
  updateProgress(catId,tabIdx);
}
function updateProgress(catId,tabIdx){
  const tab=DB[catId].tabs[tabIdx];
  const total=tab.temples.length;
  const done=tab.temples.filter((_,i)=>isVisited(catId,tabIdx,i)).length;
  const pct=Math.round(done/total*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=`${done}/${total} visited`;
  document.getElementById('progressWrap').style.display='flex';
}

function openCategory(catId){
  if(!DB[catId])return;
  currentCat=catId;
  currentTabIdx=0;
  document.getElementById('homeView').style.display='none';
  const sv=document.getElementById('sectionView');
  sv.style.display='block';
  sv.classList.add('active');
  document.getElementById('sectionSearch').value='';
  const cat=DB[catId];
  document.getElementById('sectionTitle').textContent=cat.icon+' '+cat.name;
  document.getElementById('sectionSub').textContent=cat.count+' Sacred Temples';
  renderSubTabs(catId);
  renderTemples(catId,0,'');
  window.scrollTo(0,0);
}

function goHome(){
  currentCat=null;
  document.getElementById('homeView').style.display='block';
  const sv=document.getElementById('sectionView');
  sv.style.display='none';
  sv.classList.remove('active');
  document.getElementById('progressWrap').style.display='none';
}

function renderSubTabs(catId){
  const cat=DB[catId];
  const wrap=document.getElementById('subTabsWrap');
  if(cat.tabs.length<=1){wrap.innerHTML='';return}
  wrap.innerHTML=`<div class="sub-tabs">${cat.tabs.map((t,i)=>`
    <button class="sub-tab${i===0?' active':''}" onclick="switchTab(${i})">${t.label}</button>
  `).join('')}</div>`;
}

function switchTab(idx){
  currentTabIdx=idx;
  document.querySelectorAll('.sub-tab').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('sectionSearch').value='';
  renderTemples(currentCat,idx,'');
}

// ══════════════════════════════════════════════════════════
// RENDER TEMPLES
// ══════════════════════════════════════════════════════════
function buildAddress(t){
  // Build address from old fields or new address field
  if(t.address) return t.address;
  const parts=[t.loc,t.state,t.country].filter(v=>v&&v!=='-');
  return parts.join(', ')||'-';
}
function buildReach(t){
  if(t.reach) return t.reach;
  // Auto-build from near + state fields for common pilgrims
  if(t.near&&t.near!=='-'&&t.near!==t.loc){
    const st=t.state&&t.state!=='-'?t.state:'';
    return `By Road: Regular buses and taxis from ${t.near}${st?' ('+st+')':''}\nBy Train: Nearest railway station at ${t.near}\nBy Air: Nearest airport near ${t.near}`;
  }
  return '';
}
function renderReach(reach){
  if(!reach||reach==='-') return '';
  const lines=reach.split(/\n/);
  return lines.map(line=>{
    const roadM=line.match(/^By Road[:\s]+(.*)/i);
    const trainM=line.match(/^By Train[:\s]+(.*)/i);
    const airM=line.match(/^By Air[:\s]+(.*)/i);
    const busM=line.match(/^By Bus[:\s]+(.*)/i);
    if(roadM) return `<div class="reach-row"><span class="reach-icon">🚌</span><span class="reach-label">Road</span><span class="reach-text">${roadM[1]}</span></div>`;
    if(trainM) return `<div class="reach-row"><span class="reach-icon">🚂</span><span class="reach-label">Train</span><span class="reach-text">${trainM[1]}</span></div>`;
    if(airM) return `<div class="reach-row"><span class="reach-icon">✈️</span><span class="reach-label">Air</span><span class="reach-text">${airM[1]}</span></div>`;
    if(busM) return `<div class="reach-row"><span class="reach-icon">🚌</span><span class="reach-label">Bus</span><span class="reach-text">${busM[1]}</span></div>`;
    return `<div class="reach-row"><span class="reach-icon">📍</span><span class="reach-label"></span><span class="reach-text">${line}</span></div>`;
  }).join('');
}

function renderTemples(catId,tabIdx,filter){
  const tab=DB[catId].tabs[tabIdx];
  const fl=filter.toLowerCase();
  const temples=tab.temples.filter((_,i)=>{
    const t=getTemple(catId,tabIdx,i);
    if(!fl)return true;
    return [t.name,t.deity,t.loc,t.near,t.state,t.country,t.address].some(v=>v&&v.toLowerCase().includes(fl));
  });
  const list=document.getElementById('templeList');
  if(!temples.length){list.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>No temples found</p></div>';return}
  list.innerHTML=temples.map((orig)=>{
    const ri=tab.temples.indexOf(orig);
    const t=getTemple(catId,tabIdx,ri);
    const visited=isVisited(catId,tabIdx,ri);
    const addr=buildAddress(t);
    const reachRaw=buildReach(t);
    const reachHtml=renderReach(reachRaw);
    const timings=t.timings||'';
    const about=t.about||t.notes||'';
    const dresscode=t.dresscode||'';
    const stay=t.stay||'';
    const mapsQ=encodeURIComponent((t.name||'')+' '+(t.loc||''));
    const shareText=encodeURIComponent(`🛕 ${t.name}\n🙏 ${t.deity}\n📍 ${addr}\n${timings?'🕐 '+timings+'\n':''}${t.contact&&t.contact!=='-'?'📞 '+t.contact+'\n':''}${t.months?'📅 Best time: '+t.months:''}\n\nShared from India Temple Pilgrim Guide`);
    return `<div class="t-card" id="tc-${catId}-${tabIdx}-${ri}">
      <div class="t-card-header" onclick="toggleCard('tc-${catId}-${tabIdx}-${ri}')">
        <div class="t-num">${t.sl}</div>
        <div class="t-main">
          <div class="t-name">${t.name}</div>
          <div class="t-deity">🙏 ${t.deity}</div>
        </div>
        <div class="t-expand">▾</div>
      </div>
      <div class="t-details">
        <div class="t-detail-grid">

          <div class="t-detail full">
            <div class="t-detail-label">📍 Address</div>
            <div class="t-detail-val">${addr}</div>
          </div>

          ${timings?`<div class="t-detail timing-box full">
            <div class="t-detail-label">🕐 Temple Timings</div>
            <div class="t-detail-val">${timings}</div>
          </div>`:''}

          ${t.contact&&t.contact!=='-'?`<div class="t-detail">
            <div class="t-detail-label">📞 Contact</div>
            <div class="t-detail-val"><a href="tel:${t.contact}" style="color:var(--saffron);font-weight:600">${t.contact}</a></div>
          </div>`:''}

          ${t.months?`<div class="t-detail">
            <div class="t-detail-label">📅 Best Time to Visit</div>
            <div class="t-detail-val">${t.months}</div>
          </div>`:''}

          ${reachHtml?`<div class="t-detail reach full">
            <div class="t-detail-label">🗺 How to Reach</div>
            <div class="t-detail-val" style="margin-top:4px">${reachHtml}</div>
          </div>`:''}

          ${about?`<div class="t-detail info-box full">
            <div class="t-detail-label">ℹ️ About Temple</div>
            <div class="t-detail-val">${about}</div>
          </div>`:''}

          ${dresscode?`<div class="t-detail full">
            <div class="t-detail-label">👗 Dress Code</div>
            <div class="t-detail-val">${dresscode}</div>
          </div>`:''}

          ${stay?`<div class="t-detail full">
            <div class="t-detail-label">🏨 Accommodation</div>
            <div class="t-detail-val">${stay}</div>
          </div>`:''}

        </div>
        <div class="action-row">
          <button class="edit-btn" onclick="openEdit('${catId}',${tabIdx},${ri});event.stopPropagation()">✏️ Edit</button>
          <button class="visited-btn${visited?' visited':''}" onclick="toggleVisit('${catId}',${tabIdx},${ri},this);event.stopPropagation()">${visited?'✅ Visited':'☆ Mark Visited'}</button>
          <button class="maps-btn" onclick="window.open('https://maps.google.com/?q=${mapsQ}','_blank');event.stopPropagation()">🗺 Maps</button>
          <button class="share-btn" onclick="window.open('https://wa.me/?text=${shareText}','_blank');event.stopPropagation()">📤 Share</button>
        </div>
      </div>
    </div>`;
  }).join('');
  updateProgress(catId,tabIdx);
}

function toggleCard(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('open');
}

function openEdit(catId,tabIdx,slIdx){
  const t=getTemple(catId,tabIdx,slIdx);
  editingKey={catId,tabIdx,slIdx};
  document.getElementById('e_name').value=t.name||'';
  document.getElementById('e_deity').value=t.deity||'';
  document.getElementById('e_address').value=t.address||buildAddress(t);
  document.getElementById('e_reach').value=t.reach||buildReach(t);
  document.getElementById('e_timings').value=t.timings||'';
  document.getElementById('e_contact').value=t.contact||'';
  document.getElementById('e_months').value=t.months||'';
  document.getElementById('e_about').value=t.about||t.notes||'';
  document.getElementById('e_dresscode').value=t.dresscode||'';
  document.getElementById('e_stay').value=t.stay||'';
  document.getElementById('e_notes').value=t.notes||'';
  document.getElementById('editModal').classList.add('open');
}
function closeModal(){
  document.getElementById('editModal').classList.remove('open');
  editingKey=null;
}
function saveEdit(){
  if(!editingKey)return;
  const {catId,tabIdx,slIdx}=editingKey;
  setTemple(catId,tabIdx,slIdx,{
    name:document.getElementById('e_name').value,
    deity:document.getElementById('e_deity').value,
    address:document.getElementById('e_address').value,
    reach:document.getElementById('e_reach').value,
    timings:document.getElementById('e_timings').value,
    contact:document.getElementById('e_contact').value,
    months:document.getElementById('e_months').value,
    about:document.getElementById('e_about').value,
    dresscode:document.getElementById('e_dresscode').value,
    stay:document.getElementById('e_stay').value,
    notes:document.getElementById('e_notes').value,
  });
  closeModal();
  renderTemples(catId,tabIdx,document.getElementById('sectionSearch').value);
}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ══════════════════════════════════════════════════════════
// GLOBAL SEARCH
// ══════════════════════════════════════════════════════════
function globalSearch(q){
  const sr=document.getElementById('searchResults');
  const cg=document.getElementById('categoryGrid');
  if(!q.trim()){sr.style.display='none';cg.style.display='';return}
  const fl=q.toLowerCase();
  const results=[];
  Object.entries(DB).forEach(([catId,cat])=>{
    cat.tabs.forEach((tab,tabIdx)=>{
      tab.temples.forEach((orig,slIdx)=>{
        const t=getTemple(catId,tabIdx,slIdx);
        if([t.name,t.deity,t.loc,t.near,t.state,t.country].some(v=>v&&v.toLowerCase().includes(fl))){
          results.push({catId,tabIdx,slIdx,t,catName:cat.name,catIcon:cat.icon});
        }
      });
    });
  });
  cg.style.display='none';
  if(!results.length){sr.style.display='block';sr.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>No temples found for "'+q+'"</p></div>';return}
  sr.style.display='block';
  sr.innerHTML=`<div style="padding:8px 16px 4px;font-size:.78rem;font-weight:700;color:var(--saffron)">${results.length} temple${results.length===1?'':'s'} found</div>`+
  `<div class="temple-list">`+results.slice(0,30).map(({catId,tabIdx,slIdx,t,catName,catIcon})=>`
    <div class="t-card" onclick="openCategory('${catId}')">
      <div class="t-card-header">
        <div class="t-num" style="width:auto;min-width:auto;border-radius:8px;padding:2px 6px;font-size:.65rem">${catIcon}</div>
        <div class="t-main">
          <div class="t-name">${t.name}</div>
          <div class="t-deity">🙏 ${t.deity} &nbsp;•&nbsp; ${catName}</div>
        </div>
      </div>
    </div>`).join('')+`</div>`;
}
