<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>🕉 India Temple Pilgrim Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--saffron:#E8610A;--saffron2:#FF8C2A;--saffron3:#c44a00;
--gold:#D4A017;--gold2:#F5CE5A;--gold3:#fff3c4;
--maroon:#5c1010;--maroon2:#3a0808;
--cream:#fdf6ec;--cream2:#fff9f0;
--text:#2a1000;--text2:#5a3010;--text3:#8a6040;
--card:#fffaf4;--border:#e8d5b0;
--shadow:0 4px 24px rgba(100,40,0,0.10);
--r:14px;
}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.hero{
  background:linear-gradient(160deg,var(--maroon2) 0%,var(--maroon) 40%,#7a2010 100%);
  padding:0;position:relative;overflow:hidden;
}
.hero-pattern{
  position:absolute;inset:0;opacity:.07;
  background-image:repeating-linear-gradient(45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%);
  background-size:18px 18px;
}
.hero-inner{padding:28px 20px 22px;position:relative;z-index:1;text-align:center}
.hero-om{font-size:clamp(2.4rem,8vw,4rem);line-height:1;filter:drop-shadow(0 0 20px rgba(212,160,23,.5))}
.hero-title{
  font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(1.3rem,5vw,2.6rem);
  background:linear-gradient(135deg,var(--gold2),#fff,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.15;margin:.4rem 0 .3rem;letter-spacing:.02em;
}
.hero-sub{color:rgba(255,243,196,.75);font-family:'Crimson Pro',serif;font-style:italic;font-size:clamp(.85rem,3vw,1.1rem);margin-bottom:1rem}
.hero-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat-pill{
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,243,196,.25);border-radius:40px;
  padding:5px 14px;font-size:.78rem;color:var(--gold2);font-weight:600;letter-spacing:.04em;
}

/* ── SEARCH BAR ── */
.search-wrap{padding:14px 16px 8px;background:var(--cream);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:white;border:1.5px solid var(--border);border-radius:40px;
  padding:9px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.search-box input{
  flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;
  font-size:.95rem;color:var(--text);background:transparent;
}
.search-box input::placeholder{color:#b09070}
.search-icon{color:var(--saffron);font-size:1.1rem;flex-shrink:0}

/* ── CATEGORY NAV ── */
.cat-nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;padding:7px 16px;border-radius:40px;
  border:1.5px solid var(--border);background:white;
  font-size:.8rem;font-weight:600;color:var(--text2);
  cursor:pointer;transition:.2s;white-space:nowrap;font-family:'DM Sans',sans-serif;
}
.cat-btn.active,.cat-btn:hover{background:var(--saffron);border-color:var(--saffron);color:white}

/* ── CATEGORY CARDS (HOME) ── */
.home-grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.cat-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);
  padding:16px 12px;cursor:pointer;transition:.18s;text-align:center;
  box-shadow:var(--shadow);
}
.cat-card:hover,.cat-card:active{transform:translateY(-2px);box-shadow:0 8px 28px rgba(100,40,0,.14);border-color:var(--saffron)}
.cat-card .icon{font-size:2.2rem;margin-bottom:8px;display:block}
.cat-card .cname{font-family:'Cinzel',serif;font-size:.78rem;font-weight:700;color:var(--maroon);line-height:1.3;margin-bottom:4px}
.cat-card .ccount{
  display:inline-block;background:var(--saffron);color:white;
  border-radius:20px;padding:2px 9px;font-size:.7rem;font-weight:700;
}

/* ── SECTION VIEW ── */
.section-view{display:none}
.section-view.active{display:block}

/* ── BACK HEADER ── */
.back-header{
  background:linear-gradient(135deg,var(--maroon2),var(--maroon));
  padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:99;
}
.back-btn{
  background:rgba(255,255,255,.15);border:none;border-radius:50%;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:white;font-size:1.1rem;cursor:pointer;flex-shrink:0;
}
.back-title{font-family:'Cinzel',serif;color:var(--gold2);font-weight:700;font-size:1rem;line-height:1.2}
.back-sub{color:rgba(255,243,196,.6);font-size:.72rem;margin-top:1px}

/* ── SUB-TABS ── */
.sub-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--cream2);border-bottom:1px solid var(--border);scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{
  flex-shrink:0;padding:6px 14px;border-radius:30px;
  border:1.5px solid var(--border);background:white;
  font-size:.76rem;font-weight:600;color:var(--text2);cursor:pointer;transition:.18s;
}
.sub-tab.active{background:var(--saffron);border-color:var(--saffron);color:white}

/* ── TEMPLE CARDS ── */
.temple-list{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.t-card{
  background:white;border:1.5px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.18s;
}
.t-card:hover{border-color:var(--saffron);box-shadow:0 6px 20px rgba(232,97,10,.15)}
.t-card-header{
  display:flex;align-items:center;gap:10px;padding:12px 14px 10px;
}
.t-num{
  min-width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--saffron),var(--saffron2));
  color:white;font-weight:700;font-size:.75rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Cinzel',serif;
}
.t-main{flex:1;min-width:0}
.t-name{font-family:'Cinzel',serif;font-weight:700;font-size:.88rem;color:var(--maroon);line-height:1.3;word-break:break-word}
.t-deity{color:var(--saffron);font-size:.76rem;font-weight:600;margin-top:2px}
.t-expand{color:var(--text3);font-size:.9rem;transition:.2s;flex-shrink:0}
.t-card.open .t-expand{transform:rotate(180deg)}
.t-details{
  display:none;padding:0 14px 12px;
  border-top:1px dashed var(--border);margin-top:4px;
}
.t-card.open .t-details{display:block}
.t-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.t-detail{background:var(--cream);border-radius:8px;padding:7px 10px}
.t-detail-label{font-size:.65rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.t-detail-val{font-size:.8rem;color:var(--text);font-weight:500;line-height:1.3}
.t-detail.full{grid-column:1/-1}
.t-tag{
  display:inline-block;background:var(--gold3);color:var(--maroon);
  border-radius:20px;padding:2px 8px;font-size:.68rem;font-weight:700;margin:2px 2px 0 0;border:1px solid var(--gold);
}
.edit-btn{
  display:flex;align-items:center;gap:5px;margin-top:10px;
  background:var(--saffron);color:white;border:none;border-radius:8px;
  padding:7px 14px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
}

/* ── EDIT MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:999;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:white;border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;padding:0 0 20px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:4px;margin:12px auto 0}
.modal-title{font-family:'Cinzel',serif;font-weight:700;font-size:1rem;color:var(--maroon);padding:14px 18px 10px;border-bottom:1px solid var(--border)}
.modal-body{padding:14px 18px}
.form-row{margin-bottom:12px}
.form-label{font-size:.75rem;font-weight:700;color:var(--text2);margin-bottom:4px;display:block;letter-spacing:.04em}
.form-input{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--text);
  background:var(--cream);outline:none;
}
.form-input:focus{border-color:var(--saffron);background:white}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;padding:10px 18px 0}
.btn-save{
  flex:1;background:var(--saffron);color:white;border:none;border-radius:10px;
  padding:11px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.btn-cancel{
  background:var(--cream);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 18px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;
}

/* ── PROGRESS BAR (visited) ── */
.progress-wrap{padding:10px 14px 2px;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:6px;background:#f0e0c8;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold));border-radius:3px;transition:.5s}
.progress-label{font-size:.72rem;font-weight:700;color:var(--saffron);white-space:nowrap}
.visited-btn{
  background:none;border:1.5px solid;border-radius:20px;padding:3px 10px;
  font-size:.7rem;font-weight:700;cursor:pointer;margin-left:auto;transition:.18s;
}
.visited-btn.visited{background:var(--gold3);border-color:var(--gold);color:var(--maroon)}
.visited-btn:not(.visited){border-color:var(--border);color:var(--text3)}

/* ── FOOTER / EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:3rem;margin-bottom:8px}
.page-footer{padding:30px 20px;text-align:center;color:var(--text3);font-size:.78rem;border-top:1px solid var(--border);margin-top:20px}
.page-footer strong{color:var(--saffron)}

/* ── HOME VIEW ── */
#homeView{display:block}

/* ── Responsive ── */
@media(min-width:600px){
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
  .modal{border-radius:20px;margin-bottom:20px}
  .modal-overlay{align-items:center}
}
@media(min-width:900px){
  .home-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding:20px 24px}
  .temple-list{padding:16px 20px}
  .back-header{padding:16px 24px}
}

/* ── DIVIDER ── */
.region-divider{
  display:flex;align-items:center;gap:10px;padding:16px 14px 6px;
}
.region-divider span{font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;color:var(--saffron);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.region-divider::before,.region-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.t-card{animation:fadeIn .25s ease both}
</style>
</head>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="hero">
    <div class="hero-pattern"></div>
    <div class="hero-inner">
      <div class="hero-om">🕉</div>

  <div id="categoryGrid" class="home-grid"></div>
  <div class="page-footer">

    Tap a temple → ✏️ Edit to update details
  </div>
</div>

<!-- SECTION VIEW -->
<div id="sectionView" class="section-view">
  <div class="back-header">
    <button class="back-btn" onclick="goHome()">◀</button>
    <div>

      <div class="back-sub" id="sectionSub"></div>
    </div>

  <div id="progressWrap" class="progress-wrap" style="display:none">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <div id="templeList" class="temple-list"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">

    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Edit Temple Details</div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">Temple Name</label>
        <input class="form-input" id="e_name" placeholder="Temple name"/>
      </div>
      <div class="form-row">
        <label class="form-label">God / Deity</label>
        <input class="form-input" id="e_deity" placeholder="Presiding deity"/>
      </div>
      <div class="form-row-2">
        <div class="form-row">
          <label class="form-label">Location / Town</label>
          <input class="form-input" id="e_location" placeholder="Town/Village"/>
        </div>
        <div class="form-row">
          <label class="form-label">Close To</label>
          <input class="form-input" id="e_closeto" placeholder="Nearest city"/>
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-row">
          <label class="form-label">State</label>
          <input class="form-input" id="e_state" placeholder="State"/>
        </div>
        <div class="form-row">
          <label class="form-label">Country</label>
          <input class="form-input" id="e_country" placeholder="Country"/>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Temple Contact</label>
        <input class="form-input" id="e_contact" placeholder="Phone number"/>
      </div>
      <div class="form-row">
        <label class="form-label">Best Visit Months</label>
        <input class="form-input" id="e_months" placeholder="e.g. Oct–Feb, Navratri"/>
      </div>
      <div class="form-row">
        <label class="form-label">Special Notes</label>
        <input class="form-input" id="e_notes" placeholder="Dress code, Darshan timings, etc."/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let currentCat = null;
let currentTabIdx = 0;
let editingKey = null; // "catId-tabIdx-slIdx"
let customData = {}; // override store

function loadCustom(){try{const d=localStorage.getItem('templeEdits');if(d)customData=JSON.parse(d)}catch(e){}}
function saveCustom(){try{localStorage.setItem('templeEdits',JSON.stringify(customData))}catch(e){}}
loadCustom();

function getTemple(catId,tabIdx,slIdx){
  const key=`${catId}-${tabIdx}-${slIdx}`;
  const base={...DB[catId].tabs[tabIdx].temples[slIdx]};
  return customData[key]?{...base,...customData[key]}:base;
}
function setTemple(catId,tabIdx,slIdx,data){
  const key=`${catId}-${tabIdx}-${slIdx}`;
  customData[key]={...customData[key],...data};
  saveCustom();
}

function isVisited(catId,tabIdx,slIdx){
  const k=`visited-${catId}-${tabIdx}-${slIdx}`;
  return localStorage.getItem(k)==='1';
}
function toggleVisit(catId,tabIdx,slIdx,btn){
  const k=`visited-${catId}-${tabIdx}-${slIdx}`;
  const v=localStorage.getItem(k)==='1';
  if(v)localStorage.removeItem(k);else localStorage.setItem(k,'1');
  btn.classList.toggle('visited',!v);
  btn.textContent=v?'☆ Mark Visited':'✅ Visited';
  updateProgress(catId,tabIdx);
}
function updateProgress(catId,tabIdx){
  const tab=DB[catId].tabs[tabIdx];
  const total=tab.temples.length;
  const done=tab.temples.filter((_,i)=>isVisited(catId,tabIdx,i)).length;
  const pct=Math.round(done/total*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=`${done}/${total} visited`;
  document.getElementById('progressWrap').style.display='flex';
}

// ══════════════════════════════════════════════════════════
// RENDER HOME
// ══════════════════════════════════════════════════════════
function renderHome(){
  const g=document.getElementById('categoryGrid');
  g.innerHTML=CATS.map(c=>`
    <div class="cat-card" onclick="openCategory('${c.id}')" style="border-top:3px solid ${c.color}">
      <span class="icon">${c.icon}</span>
      <div class="cname">${c.name}</div>
      <span class="ccount">${c.count} Temples</span>
    </div>
  `).join('');
}

// ══════════════════════════════════════════════════════════
// OPEN CATEGORY
// ══════════════════════════════════════════════════════════
function openCategory(catId){
  if(!DB[catId])return;
  currentCat=catId;
  currentTabIdx=0;
  document.getElementById('homeView').style.display='none';
  const sv=document.getElementById('sectionView');
  sv.style.display='block';
  sv.classList.add('active');
  document.getElementById('sectionSearch').value='';
  const cat=DB[catId];
  document.getElementById('sectionTitle').textContent=cat.icon+' '+cat.name;
  document.getElementById('sectionSub').textContent=cat.count+' Sacred Temples';
  renderSubTabs(catId);
  renderTemples(catId,0,'');
  window.scrollTo(0,0);
}

function goHome(){
  currentCat=null;
  document.getElementById('homeView').style.display='block';
  const sv=document.getElementById('sectionView');
  sv.style.display='none';
  sv.classList.remove('active');
  document.getElementById('progressWrap').style.display='none';
}

function renderSubTabs(catId){
  const cat=DB[catId];
  const wrap=document.getElementById('subTabsWrap');
  if(cat.tabs.length<=1){wrap.innerHTML='';return}
  wrap.innerHTML=`<div class="sub-tabs">${cat.tabs.map((t,i)=>`
    <button class="sub-tab${i===0?' active':''}" onclick="switchTab(${i})">${t.label}</button>
  `).join('')}</div>`;
}

function switchTab(idx){
  currentTabIdx=idx;
  document.querySelectorAll('.sub-tab').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('sectionSearch').value='';
  renderTemples(currentCat,idx,'');
}

// ══════════════════════════════════════════════════════════
// RENDER TEMPLES
// ══════════════════════════════════════════════════════════
function renderTemples(catId,tabIdx,filter){
  const tab=DB[catId].tabs[tabIdx];
  const fl=filter.toLowerCase();
  const temples=tab.temples.filter((_,i)=>{
    const t=getTemple(catId,tabIdx,i);
    if(!fl)return true;
    return [t.name,t.deity,t.loc,t.near,t.state,t.country].some(v=>v&&v.toLowerCase().includes(fl));
  });
  const list=document.getElementById('templeList');
  if(!temples.length){list.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>No temples found</p></div>';return}
  list.innerHTML=temples.map((orig,fi)=>{
    const ri=tab.temples.indexOf(orig);
    const t=getTemple(catId,tabIdx,ri);
    const visited=isVisited(catId,tabIdx,ri);
    return `<div class="t-card" id="tc-${catId}-${tabIdx}-${ri}">
      <div class="t-card-header" onclick="toggleCard('tc-${catId}-${tabIdx}-${ri}')">
        <div class="t-num">${t.sl}</div>
        <div class="t-main">
          <div class="t-name">${t.name}</div>
          <div class="t-deity">🙏 ${t.deity}</div>
        </div>
        <div class="t-expand">▾</div>
      </div>
      <div class="t-details">
        <div class="t-detail-grid">
          <div class="t-detail"><div class="t-detail-label">📍 Location</div><div class="t-detail-val">${t.loc||'-'}</div></div>
          <div class="t-detail"><div class="t-detail-label">🗺 Close To</div><div class="t-detail-val">${t.near||'-'}</div></div>
          <div class="t-detail"><div class="t-detail-label">🏛 State</div><div class="t-detail-val">${t.state||'-'}</div></div>
          <div class="t-detail"><div class="t-detail-label">🌍 Country</div><div class="t-detail-val">${t.country||'-'}</div></div>
          <div class="t-detail"><div class="t-detail-label">📞 Contact</div><div class="t-detail-val">${t.contact&&t.contact!=='-'?`<a href="tel:${t.contact}" style="color:var(--saffron)">${t.contact}</a>`:'-'}</div></div>
          <div class="t-detail"><div class="t-detail-label">📅 Best Months</div><div class="t-detail-val">${t.months||'-'}</div></div>
          ${t.notes?`<div class="t-detail full"><div class="t-detail-label">📝 Notes</div><div class="t-detail-val">${t.notes}</div></div>`:''}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
          <button class="edit-btn" onclick="openEdit('${catId}',${tabIdx},${ri});event.stopPropagation()">✏️ Edit</button>
          <button class="visited-btn${visited?' visited':''}" onclick="toggleVisit('${catId}',${tabIdx},${ri},this);event.stopPropagation()">${visited?'✅ Visited':'☆ Mark Visited'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
  updateProgress(catId,tabIdx);
}

function toggleCard(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('open');
}

function filterSection(q){if(currentCat!==null)renderTemples(currentCat,currentTabIdx,q)}

// ══════════════════════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════════════════════
function openEdit(catId,tabIdx,slIdx){
  const t=getTemple(catId,tabIdx,slIdx);
  editingKey={catId,tabIdx,slIdx};
  document.getElementById('e_name').value=t.name||'';
  document.getElementById('e_deity').value=t.deity||'';
  document.getElementById('e_location').value=t.loc||'';
  document.getElementById('e_closeto').value=t.near||'';
  document.getElementById('e_state').value=t.state||'';
  document.getElementById('e_country').value=t.country||'';
  document.getElementById('e_contact').value=t.contact||'';
  document.getElementById('e_months').value=t.months||'';
  document.getElementById('e_notes').value=t.notes||'';
  document.getElementById('editModal').classList.add('open');
}
function closeModal(){
  document.getElementById('editModal').classList.remove('open');
  editingKey=null;
}
function saveEdit(){
  if(!editingKey)return;
  const {catId,tabIdx,slIdx}=editingKey;
  setTemple(catId,tabIdx,slIdx,{
    name:document.getElementById('e_name').value,
    deity:document.getElementById('e_deity').value,
    loc:document.getElementById('e_location').value,
    near:document.getElementById('e_closeto').value,
    state:document.getElementById('e_state').value,
    country:document.getElementById('e_country').value,
    contact:document.getElementById('e_contact').value,
    months:document.getElementById('e_months').value,
    notes:document.getElementById('e_notes').value,
  });
  closeModal();
  renderTemples(catId,tabIdx,document.getElementById('sectionSearch').value);
}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ══════════════════════════════════════════════════════════
// GLOBAL SEARCH
// ══════════════════════════════════════════════════════════
function globalSearch(q){
  const sr=document.getElementById('searchResults');
  const cg=document.getElementById('categoryGrid');
  if(!q.trim()){sr.style.display='none';cg.style.display='';return}
  const fl=q.toLowerCase();
  const results=[];
  Object.entries(DB).forEach(([catId,cat])=>{
    cat.tabs.forEach((tab,tabIdx)=>{
      tab.temples.forEach((orig,slIdx)=>{
        const t=getTemple(catId,tabIdx,slIdx);
        if([t.name,t.deity,t.loc,t.near,t.state,t.country].some(v=>v&&v.toLowerCase().includes(fl))){
          results.push({catId,tabIdx,slIdx,t,catName:cat.name,catIcon:cat.icon});
        }
      });
    });
  });
  cg.style.display='none';
  if(!results.length){sr.style.display='block';sr.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>No temples found for "'+q+'"</p></div>';return}
  sr.style.display='block';
  sr.innerHTML=`<div style="padding:8px 16px 4px;font-size:.78rem;font-weight:700;color:var(--saffron)">${results.length} temple${results.length===1?'':'s'} found</div>`+
  `<div class="temple-list">`+results.slice(0,30).map(({catId,tabIdx,slIdx,t,catName,catIcon})=>`
    <div class="t-card" onclick="openCategory('${catId}')">
      <div class="t-card-header">
        <div class="t-num" style="width:auto;min-width:auto;border-radius:8px;padding:2px 6px;font-size:.65rem">${catIcon}</div>
        <div class="t-main">
          <div class="t-name">${t.name}</div>
          <div class="t-deity">🙏 ${t.deity} &nbsp;•&nbsp; ${catName}</div>
        </div>
      </div>
    </div>`).join('')+`</div>`;
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
renderHome();
</script>
